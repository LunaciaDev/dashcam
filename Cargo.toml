[package]
name = "dashcam"
version = "0.1.0"
edition = "2024"

[dependencies]
nix = { version = "0.30.1", features = ["mman", "fs"] }
signal-hook = "0.3.18"
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }

[build-dependencies]
bindgen = "0.72.0"
cc = "1.2.32"
pkg-config = "0.3.32"
